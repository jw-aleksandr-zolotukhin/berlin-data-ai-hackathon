  # ── fct_title_acquisition_priority ───────────────────────────────────────────
  - name: fct_title_acquisition_priority
    description: |
      **Grain: one row per top-level title**

      The StreamCap "Shopping List" — the primary output model of the entire
      analytics pipeline. Combines all upstream signals into a single ranked table
      that answers: *"Which titles should JustWatch license, for which audience,
      and why?"*

      **Sources joined:**
      - `fct_title_revenue_estimate` — ROI scores, revenue estimates, cost tier, supply flags
      - `fct_segment_title_demand` (filtered by segment) — who wants each title
      - Scarcity index computed inline: `1 / (1 + total_provider_count)`

      **Composite acquisition score formula:**
      ```
      avod_roi_score + tvod_roi_score        ← base ROI (demand ÷ cost)
      + 25 if market_count >= 3              ← cross-market arbitrage bonus
      + 20 if is_avod_underserved            ← AVOD gap opportunity bonus
      + 15 if tvod_raw_score > 0             ← TVOD-to-AVOD pipeline bonus
           AND NOT has_avod_supply
      + 15 if churn_risk_demand > 0          ← churn prevention bonus
      + 10 if binger_avod_demand >           ← binger segment driven bonus
           avod_raw_score × 0.3
      ```
      All bonus values are explicit and tunable — finance stakeholders can
      adjust them based on strategic priorities without rewriting SQL.

      **Three specialised ranks** are computed:
      1. `acquisition_rank` — overall composite score rank
      2. `churn_prevention_rank` — rank within `is_churn_prevention_title = true`
         titles, sorted by `churn_risk_demand`
      3. `tvod_to_avod_rank` — rank within TVOD-to-AVOD candidates sorted by
         `tvod_raw_score`

      **Strategic flags** map directly to the four business case narratives in
      the StreamCap pitch:
      - `is_avod_gap_opportunity` → "Underserved AVOD Demand" slide
      - `is_tvod_to_avod_candidate` → "TVOD-to-AVOD Pipeline" slide
      - `is_churn_prevention_title` → "Churn Prevention Acquisition" slide
      - `is_cross_market_opportunity` → "Cross-Market Arbitrage" slide
    meta:
      metrics:
        total_pipeline_revenue_usd:
          type: number
          sql: "SUM(${TABLE}.total_revenue_usd)"
          label: "Total Estimated Pipeline Revenue"
          description: "Sum of estimated AVOD + TVOD revenue across all titles."
          format: "usd"
          compact: "millions"
          round: 0
          groups:
            - "Revenue Estimates"
        avg_roi_usd:
          type: number
          sql: "AVG(${TABLE}.roi_usd)"
          label: "Avg ROI per Title"
          format: "usd"
          round: 2
          groups:
            - "Revenue Estimates"
        avod_gap_opportunity_count:
          type: number
          sql: "COUNT(CASE WHEN ${TABLE}.is_avod_gap_opportunity THEN 1 END)"
          label: "AVOD Gap Opportunities"
          description: "Count of titles that are AVOD underserved AND driven by Bingers."
          groups:
            - "Strategic Flags"
        churn_prevention_count:
          type: number
          sql: "COUNT(CASE WHEN ${TABLE}.is_churn_prevention_title THEN 1 END)"
          label: "Churn Prevention Titles"
          groups:
            - "Strategic Flags"
        cross_market_count:
          type: number
          sql: "COUNT(CASE WHEN ${TABLE}.is_cross_market_opportunity THEN 1 END)"
          label: "Cross-Market Opportunity Titles"
          groups:
            - "Strategic Flags"
        tvod_to_avod_count:
          type: number
          sql: "COUNT(CASE WHEN ${TABLE}.is_tvod_to_avod_candidate THEN 1 END)"
          label: "TVOD-to-AVOD Pipeline Titles"
          groups:
            - "Strategic Flags"
    columns:
      - name: title_entity_id
        description: "Primary key. Join to `base_objects.object_id` for additional metadata not carried in this model."
        meta:
          dimension:
            type: string
            label: "Title ID"
          metrics:
            total_titles:
              type: count_distinct
              label: "Total Titles in Pipeline"
              groups:
                - "Volume"

      - name: title
        description: "Title name from base_objects."
        meta:
          dimension:
            type: string
            label: "Title"

      - name: object_type
        description: "Content type: 'movie' or 'show'."
        meta:
          dimension:
            type: string
            label: "Content Type"

      - name: release_year
        description: "Year of original release."
        meta:
          dimension:
            type: number
            label: "Release Year"

      - name: original_language
        description: "Original production language (ISO 639-1 code)."
        meta:
          dimension:
            type: string
            label: "Original Language"

      - name: imdb_score
        description: "IMDB rating score (0–10)."
        meta:
          dimension:
            type: number
            label: "IMDB Score"
          metrics:
            avg_imdb_score_pipeline:
              type: average
              label: "Avg IMDB Score"
              round: 2
              groups:
                - "Content Quality"

      - name: cost_tier
        description: "Estimated licensing cost category: `'premium'`, `'mid_tier'`, `'catalog'`, `'low_cost'`."
        meta:
          dimension:
            type: string
            label: "Cost Tier"

      - name: acquisition_tier
        description: "Acquisition ROI tier: `'top_10pct'`, `'top_25pct'`, `'mid'`, `'tail'`."
        meta:
          dimension:
            type: string
            label: "Acquisition Tier"

      - name: dominant_monetization
        description: "Dominant monetization model based on clickout mix: `'avod'`, `'tvod'`, `'svod'`, `'mixed'`, `'unknown'`."
        meta:
          dimension:
            type: string
            label: "Dominant Monetization"

      - name: monetization_signal
        description: "Human-readable licensing recommendation: `'LICENSE FOR AVOD'`, `'LICENSE FOR TVOD'`, `'SKIP - ON SVOD'`, `'MIXED DEMAND'`, `'NO CLICKOUT DATA'`."
        meta:
          dimension:
            type: string
            label: "Monetization Signal"

      - name: licensing_recommendation
        description: "Rule-based recommendation: `'avod_priority'`, `'tvod_priority'`, `'low_priority'`."
        meta:
          dimension:
            type: string
            label: "Licensing Recommendation"

      - name: market_count
        description: "Count of distinct markets with demand for this title."
        meta:
          dimension:
            type: number
            label: "Market Count"
          metrics:
            avg_market_count_pipeline:
              type: average
              label: "Avg Market Count"
              round: 1
              groups:
                - "Market Insights"

      - name: has_avod_supply
        description: "True if at least one free/ads clickout was observed."
        meta:
          dimension:
            type: boolean
            label: "Has AVOD Supply"

      - name: has_tvod_supply
        description: "True if at least one rent/buy/cinema clickout was observed."
        meta:
          dimension:
            type: boolean
            label: "Has TVOD Supply"

      - name: has_svod_supply
        description: "True if at least one flatrate/sports clickout was observed."
        meta:
          dimension:
            type: boolean
            label: "Has SVOD Supply"

      - name: is_avod_underserved
        description: "True: AVOD demand exists but no free/ads supply observed."
        meta:
          dimension:
            type: boolean
            label: "AVOD Underserved"

      - name: is_tvod_underserved
        description: "True: TVOD demand exists but no rent/buy supply observed."
        meta:
          dimension:
            type: boolean
            label: "TVOD Underserved"

      - name: acquisition_rank
        description: "Primary sort column for the dashboard Shopping List. Rank 1 = highest composite acquisition score. Computed by `ROW_NUMBER() OVER (ORDER BY composite_acquisition_score DESC)`."
        meta:
          dimension:
            type: number
            label: "Acquisition Rank"

      - name: composite_acquisition_score
        description: |
          Blended score combining ROI and strategic bonuses. See model description for
          the full formula. **The bonuses are intentionally transparent** — each bonus
          component is also available as an individual flag (`is_avod_gap_opportunity`,
          etc.) so stakeholders can explain any title's score component by component.
        meta:
          dimension:
            type: number
            label: "Composite Acquisition Score"
          metrics:
            avg_composite_score:
              type: average
              label: "Avg Composite Score"
              round: 2
              groups:
                - "Acquisition Priority"
            max_composite_score:
              type: max
              label: "Top Composite Score"
              round: 2
              groups:
                - "Acquisition Priority"
            sum_composite_score:
              type: sum
              label: "Total Pipeline Score"
              compact: "millions"
              groups:
                - "Acquisition Priority"

      - name: avod_revenue_usd
        description: "Estimated AVOD ad revenue: `avod_clickouts × clickout_to_view_conversion × view_hours × ecpm / 1000`."
        meta:
          dimension:
            type: number
            label: "Est. AVOD Revenue (USD)"
          metrics:
            total_avod_revenue:
              type: sum
              label: "Total Est. AVOD Revenue"
              format: "usd"
              compact: "thousands"
              round: 0
              groups:
                - "Revenue Estimates"
            avg_avod_revenue_per_title:
              type: average
              label: "Avg AVOD Revenue per Title"
              format: "usd"
              round: 2
              groups:
                - "Revenue Estimates"

      - name: tvod_revenue_usd
        description: "Estimated TVOD transaction margin: `rent_clickouts × margin_per_rent + buy_clickouts × margin_per_buy`."
        meta:
          dimension:
            type: number
            label: "Est. TVOD Revenue (USD)"
          metrics:
            total_tvod_revenue:
              type: sum
              label: "Total Est. TVOD Revenue"
              format: "usd"
              compact: "thousands"
              round: 0
              groups:
                - "Revenue Estimates"
            avg_tvod_revenue_per_title:
              type: average
              label: "Avg TVOD Revenue per Title"
              format: "usd"
              round: 2
              groups:
                - "Revenue Estimates"

      - name: total_revenue_usd
        description: "Combined AVOD + TVOD estimated revenue."
        meta:
          dimension:
            type: number
            label: "Est. Total Revenue (USD)"
          metrics:
            total_pipeline_revenue:
              type: sum
              label: "Total Pipeline Revenue (USD)"
              format: "usd"
              compact: "thousands"
              round: 0
              groups:
                - "Revenue Estimates"
            avg_revenue_per_title:
              type: average
              label: "Avg Revenue per Title (USD)"
              format: "usd"
              round: 2
              groups:
                - "Revenue Estimates"

      - name: roi_usd
        description: "Revenue / cost multiplier index. Higher = better acquisition ROI in dollar terms."
        meta:
          dimension:
            type: number
            label: "ROI (USD)"
          metrics:
            avg_roi_per_title:
              type: average
              label: "Avg ROI per Title"
              format: "usd"
              round: 2
              groups:
                - "Revenue Estimates"
            max_roi_title:
              type: max
              label: "Best Title ROI"
              format: "usd"
              round: 2
              groups:
                - "Revenue Estimates"

      - name: avod_raw_score
        description: "Absolute weighted AVOD engagement score."
        meta:
          dimension:
            type: number
            label: "AVOD Raw Score"
          metrics:
            total_avod_demand:
              type: sum
              label: "Total AVOD Demand Score"
              compact: "millions"
              groups:
                - "AVOD Demand"

      - name: tvod_raw_score
        description: "Absolute weighted TVOD transactional intent score."
        meta:
          dimension:
            type: number
            label: "TVOD Raw Score"
          metrics:
            total_tvod_demand:
              type: sum
              label: "Total TVOD Demand Score"
              compact: "thousands"
              groups:
                - "TVOD Demand"

      - name: avod_roi_score
        description: "AVOD raw score divided by cost_multiplier."
        meta:
          dimension:
            type: number
            label: "AVOD ROI Score"
          metrics:
            avg_avod_roi:
              type: average
              label: "Avg AVOD ROI Score"
              round: 2
              groups:
                - "Acquisition Priority"

      - name: tvod_roi_score
        description: "TVOD raw score divided by cost_multiplier."
        meta:
          dimension:
            type: number
            label: "TVOD ROI Score"
          metrics:
            avg_tvod_roi:
              type: average
              label: "Avg TVOD ROI Score"
              round: 2
              groups:
                - "Acquisition Priority"

      - name: scarcity_index
        description: |
          `1.0 / (1.0 + total_provider_count)`. Range: approaching 1 (title on no platforms)
          to approaching 0 (title on many platforms). Titles with high scarcity and high
          demand are the lowest-cost acquisition opportunities: the market has not yet
          recognised their value.
        meta:
          dimension:
            type: number
            label: "Scarcity Index (0–1)"
          metrics:
            avg_scarcity_index:
              type: average
              label: "Avg Scarcity Index"
              round: 2
              description: "Average scarcity — higher means more titles have no current supply."
              groups:
                - "Supply Coverage"

      - name: binger_avod_demand
        description: "AVOD demand score from the Binger segment only, sourced from `fct_segment_title_demand`. High binger demand with no free supply is the AVOD gap opportunity signal."
        meta:
          dimension:
            type: number
            label: "Binger AVOD Demand"
          metrics:
            total_binger_avod_demand:
              type: sum
              label: "Total Binger AVOD Demand"
              compact: "thousands"
              groups:
                - "Segment Demand"
            avg_binger_avod_demand:
              type: average
              label: "Avg Binger AVOD Demand"
              round: 1
              groups:
                - "Segment Demand"

      - name: whale_tvod_demand
        description: "TVOD demand from the Whale segment. Whales actively pay to watch — their demand is the most reliable predictor of TVOD revenue potential."
        meta:
          dimension:
            type: number
            label: "Whale TVOD Demand"
          metrics:
            total_whale_tvod_demand:
              type: sum
              label: "Total Whale TVOD Demand"
              compact: "thousands"
              groups:
                - "Segment Demand"
            avg_whale_tvod_demand:
              type: average
              label: "Avg Whale TVOD Demand"
              round: 1
              groups:
                - "Segment Demand"

      - name: churn_risk_demand
        description: "Combined AVOD + TVOD demand from the churn-risk segment. When > 0, the title is flagged `is_churn_prevention_title = true` and earns a +15 score bonus. Licensing this title may retain at-risk high-value users."
        meta:
          dimension:
            type: number
            label: "Churn Risk Demand"
          metrics:
            total_churn_risk_demand:
              type: sum
              label: "Total Churn Risk Demand"
              compact: "thousands"
              groups:
                - "Churn Prevention"
            avg_churn_risk_demand:
              type: average
              label: "Avg Churn Risk Demand"
              round: 1
              groups:
                - "Churn Prevention"

      - name: is_avod_gap_opportunity
        description: "`is_avod_underserved AND binger_avod_demand > 0`. Both conditions must be true: the title is underserved globally AND the Binger segment (the target AVOD audience) is specifically interested."
        meta:
          dimension:
            type: boolean
            label: "AVOD Gap Opportunity"
          metrics:
            count_avod_gap_opportunities:
              type: count
              label: "AVOD Gap Opportunity Titles"
              filters:
                - is_avod_gap_opportunity: "true"
              groups:
                - "Strategic Flags"

      - name: is_tvod_to_avod_candidate
        description: "`tvod_raw_score > 0 AND NOT has_avod_supply`. Users are willing to pay to watch it but no free option exists. Acquiring AVOD rights would be a market-disrupting move."
        meta:
          dimension:
            type: boolean
            label: "TVOD-to-AVOD Candidate"
          metrics:
            count_tvod_to_avod:
              type: count
              label: "TVOD-to-AVOD Candidate Titles"
              filters:
                - is_tvod_to_avod_candidate: "true"
              groups:
                - "Strategic Flags"

      - name: is_churn_prevention_title
        description: "`churn_risk_demand > 0`. At-risk users have shown specific interest in this title. Licensing it as a retention intervention may be cheaper than acquiring a new user to replace a churner."
        meta:
          dimension:
            type: boolean
            label: "Churn Prevention Title"
          metrics:
            count_churn_prevention:
              type: count
              label: "Churn Prevention Titles"
              filters:
                - is_churn_prevention_title: "true"
              groups:
                - "Churn Prevention"

      - name: is_cross_market_opportunity
        description: "`market_count >= 3`. Demanded in three or more distinct markets. Titles with broad geographic demand offer better licensing ROI because the same licence can serve multiple markets."
        meta:
          dimension:
            type: boolean
            label: "Cross-Market Opportunity"
          metrics:
            count_cross_market:
              type: count
              label: "Cross-Market Titles"
              filters:
                - is_cross_market_opportunity: "true"
              groups:
                - "Strategic Flags"

      - name: is_binger_driven
        description: "`binger_avod_demand > avod_raw_score × 0.3`. More than 30 % of this title's AVOD demand comes from the Binger segment. Confirms the title is a good AVOD catalogue fit, not just a general popularity spike."
        meta:
          dimension:
            type: boolean
            label: "Binger-Driven"
          metrics:
            count_binger_driven:
              type: count
              label: "Binger-Driven Titles"
              filters:
                - is_binger_driven: "true"
              groups:
                - "Strategic Flags"

      - name: churn_prevention_rank
        description: "Rank within `is_churn_prevention_title = true` titles, ordered by `churn_risk_demand DESC`. Use to prioritise the most impactful retention-driven acquisitions."
        meta:
          dimension:
            type: number
            label: "Churn Prevention Rank"

      - name: tvod_to_avod_rank
        description: "Rank within `is_tvod_to_avod_candidate = true` titles, ordered by `tvod_raw_score DESC`. The highest-ranked titles are those where users most strongly demonstrate willingness to pay, making free-rights acquisition the biggest value play."
        meta:
          dimension:
            type: number
            label: "TVOD-to-AVOD Rank"

      - name: binger_user_count
        description: "Count of distinct Binger segment users who engaged with this title."
        meta:
          dimension:
            type: number
            label: "Binger Users"
          metrics:
            total_binger_users:
              type: sum
              label: "Total Binger Users Across Pipeline"
              compact: "thousands"
              groups:
                - "Segment Demand"

      - name: whale_user_count
        description: "Count of distinct Whale segment users who engaged with this title."
        meta:
          dimension:
            type: number
            label: "Whale Users"
          metrics:
            total_whale_users:
              type: sum
              label: "Total Whale Users Across Pipeline"
              compact: "thousands"
              groups:
                - "Segment Demand"

      - name: churn_risk_user_count
        description: "Count of distinct churn-risk users who engaged with this title."
        meta:
          dimension:
            type: number
            label: "Churn Risk Users"
          metrics:
            total_churn_risk_users:
              type: sum
              label: "Total Churn Risk Users Across Pipeline"
              compact: "thousands"
              groups:
                - "Churn Prevention"

      - name: avod_pct
        description: "Share of this title's clickouts that went to free/ads providers (0–100)."
        meta:
          dimension:
            type: number
            label: "AVOD Clickout Share %"
          metrics:
            avg_avod_pct:
              type: average
              label: "Avg AVOD Clickout Share %"
              round: 1
              groups:
                - "Monetization Profile"

      - name: tvod_pct
        description: "Share of this title's clickouts that went to rent/buy/cinema (0–100)."
        meta:
          dimension:
            type: number
            label: "TVOD Clickout Share %"
          metrics:
            avg_tvod_pct:
              type: average
              label: "Avg TVOD Clickout Share %"
              round: 1
              groups:
                - "Monetization Profile"

      - name: svod_pct
        description: "Share of this title's clickouts that went to flatrate/sports subscription services (0–100)."
        meta:
          dimension:
            type: number
            label: "SVOD Clickout Share %"
          metrics:
            avg_svod_pct:
              type: average
              label: "Avg SVOD Clickout Share %"
              round: 1
              groups:
                - "Monetization Profile"

      - name: is_tvod_only
        description: "True if title has only TVOD demand (no AVOD or SVOD clickouts observed)."
        meta:
          dimension:
            type: boolean
            label: "TVOD Only"

      - name: is_svod_exclusive
        description: "True if title has only SVOD clickouts — currently on subscription only."
        meta:
          dimension:
            type: boolean
            label: "SVOD Exclusive"
