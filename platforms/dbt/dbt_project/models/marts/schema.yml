version: 2

# ──────────────────────────────────────────────────────────────────────────────
# MARTS LAYER — StreamCap / JustWatch Content Licensing Intelligence
#
# Purpose: analytics-ready aggregated outputs consumed by Lightdash dashboards,
# the StreamCap CFO UI, and the ML pipeline (streamcap_ml.py).
#
# All mart models are materialised as TABLE for dashboard query performance.
# They join intermediate pre-aggregations with base dimension tables — no mart
# model scans the raw event stream directly.
#
# DAG summary:
#   int_title_demand_signals
#   int_title_provider_supply   ──► fct_title_licensing_score
#   int_title_market_demand          │
#                                    ├──► fct_title_acquisition_priority  (main output)
#   fct_user_segments ──────────────►│
#   fct_segment_title_demand ───────►│
#
#   base_objects + int_title_demand_signals ──► fct_genre_demand_profile
#   int_title_market_demand + int_title_provider_supply ──► fct_market_demand_gap
#   base_events_t3 + base_objects ──► fct_title_seasonality
#   int_user_activity ──► fct_user_segments ──► fct_segment_title_demand
# ──────────────────────────────────────────────────────────────────────────────

models:

  # ── fct_title_licensing_score ─────────────────────────────────────────────────
  - name: fct_title_licensing_score
    description: |
      **Grain: one row per top-level title (movie or show)**

      Core licensing ROI model. Combines aggregated demand signals with content
      metadata and an estimated licensing cost proxy to produce per-title AVOD
      and TVOD ROI scores and strategic supply-gap flags.

      **Top-level-only filter:** `WHERE title_id = object_id` in the `objects` CTE
      restricts the join to movies and shows. This is safe because
      `cc_title:jwEntityId` in events always points to the top-level title —
      even when an event fires on an episode page.

      **AVOD demand score formula** (weights are tunable in the model):
      ```
      page_views × 1 + title_clicks × 2 + watchlist_adds × 5
      + seenlist_adds × 3 + likes × 4 + trailer_plays × 2 + avod_clickouts × 10
      ```
      Weights reflect decreasing signal quality: a page view is cheap (any scroll),
      a watchlist add requires deliberate intent, a clickout to a free offer is the
      strongest AVOD intent measurable without actual play data.

      **TVOD demand score formula:**
      ```
      rent_clickouts × 10 + buy_clickouts × 8 + cinema_clickouts × 6
      ```

      **Cost tier logic** approximates relative licensing cost using two observable
      proxies — recency and IMDB popularity — because actual licensing prices are
      not available:
      - `'premium'`  → `release_year >= 2024` AND `imdb_votes > 100 000` (recent blockbuster)
      - `'mid_tier'` → `release_year >= 2021` AND `imdb_votes > 50 000`
      - `'catalog'`  → `imdb_votes > 10 000` (known older title)
      - `'low_cost'` → everything else

      Movies attract a 1.5× cost multiplier over shows because per-title movie
      licensing costs more than a show licence of equivalent popularity.

      **Underserved demand flags** (`is_avod_underserved`, `is_tvod_underserved`)
      are true when demand > 0 AND no supply of the corresponding type was observed
      in `int_title_provider_supply`. These are the core inputs to the "gap
      opportunity" strategy in `fct_title_acquisition_priority`.
    meta:
      metrics:
        avod_tvod_roi_ratio:
          type: number
          sql: "SUM(${TABLE}.avod_roi_score) / NULLIF(SUM(${TABLE}.tvod_roi_score), 0)"
          label: "AVOD/TVOD ROI Ratio"
          description: "Ratio of total AVOD ROI to TVOD ROI across all titles. > 1 means AVOD opportunity dominates."
          round: 2
          groups:
            - "ROI Scores"
        avod_underserved_pct:
          type: number
          sql: "COUNT(CASE WHEN ${TABLE}.is_avod_underserved THEN 1 END)::float / NULLIF(COUNT(*), 0) * 100"
          label: "% Titles AVOD Underserved"
          description: "Percentage of titles with AVOD demand but no current free/ads supply."
          round: 1
          groups:
            - "Gap Opportunities"
        avg_market_reach:
          type: number
          sql: "AVG(${TABLE}.market_count)"
          label: "Avg Market Reach"
          description: "Average number of markets demanding each title."
          round: 1
          groups:
            - "Market Insights"
    columns:
      - name: title_entity_id
        description: "Primary key. JustWatch top-level title ID. Join to `base_objects.object_id`. Foreign key to `fct_title_acquisition_priority`."
        meta:
          dimension:
            type: string
            label: "Title ID"
          metrics:
            title_count:
              type: count_distinct
              label: "Titles with Demand"
              description: "Count of distinct titles with any demand signal."
              groups:
                - "Volume"

      - name: title
        description: "Title name from base_objects."
        meta:
          dimension:
            type: string
            label: "Title"

      - name: object_type
        description: "Content type: 'movie' or 'show'."
        meta:
          dimension:
            type: string
            label: "Content Type"

      - name: release_year
        description: "Year of release from base_objects."
        meta:
          dimension:
            type: number
            label: "Release Year"

      - name: original_language
        description: "Original production language (ISO 639-1 code)."
        meta:
          dimension:
            type: string
            label: "Original Language"

      - name: imdb_score
        description: "IMDB rating score (0–10)."
        meta:
          dimension:
            type: number
            label: "IMDB Score"
          metrics:
            avg_imdb_score:
              type: average
              label: "Avg IMDB Score"
              round: 2
              groups:
                - "Content Quality"

      - name: imdb_votes
        description: "IMDB vote count. Used as a popularity proxy in cost tier calculation."
        meta:
          dimension:
            type: number
            label: "IMDB Votes"
          metrics:
            avg_imdb_votes:
              type: average
              label: "Avg IMDB Votes"
              round: 0
              compact: "thousands"
              groups:
                - "Content Quality"

      - name: avod_raw_score
        description: "Absolute weighted AVOD engagement score. Sum of `page_views × 1 + title_clicks × 2 + watchlist_adds × 5 + seenlist_adds × 3 + likes × 4 + trailer_plays × 2 + avod_clickouts × 10`. Not normalised — use `avod_roi_score` for cross-title comparison."
        meta:
          dimension:
            type: number
            label: "AVOD Raw Score"
          metrics:
            total_avod_raw_score:
              type: sum
              label: "Total AVOD Demand Score"
              description: "Sum of AVOD raw scores across all titles."
              groups:
                - "AVOD Demand"
            avg_avod_raw_score:
              type: average
              label: "Avg AVOD Score per Title"
              round: 1
              groups:
                - "AVOD Demand"

      - name: tvod_raw_score
        description: "Absolute weighted TVOD transactional intent score. Sum of `rent_clickouts × 10 + buy_clickouts × 8 + cinema_clickouts × 6`."
        meta:
          dimension:
            type: number
            label: "TVOD Raw Score"
          metrics:
            total_tvod_raw_score:
              type: sum
              label: "Total TVOD Demand Score"
              description: "Sum of TVOD raw scores across all titles."
              groups:
                - "TVOD Demand"
            avg_tvod_raw_score:
              type: average
              label: "Avg TVOD Score per Title"
              round: 1
              groups:
                - "TVOD Demand"

      - name: avod_roi_score
        description: "AVOD raw score divided by `cost_multiplier`. Normalises demand by estimated cost, enabling fair comparison between a cheap catalog title with moderate demand and an expensive blockbuster with high demand."
        meta:
          dimension:
            type: number
            label: "AVOD ROI Score"
          metrics:
            total_avod_roi_score:
              type: sum
              label: "Total AVOD ROI Score"
              groups:
                - "ROI Scores"
            avg_avod_roi_score:
              type: average
              label: "Avg AVOD ROI Score"
              round: 2
              groups:
                - "ROI Scores"
            max_avod_roi_score:
              type: max
              label: "Peak AVOD ROI Score"
              round: 2
              groups:
                - "ROI Scores"

      - name: tvod_roi_score
        description: "TVOD raw score divided by `cost_multiplier`."
        meta:
          dimension:
            type: number
            label: "TVOD ROI Score"
          metrics:
            total_tvod_roi_score:
              type: sum
              label: "Total TVOD ROI Score"
              groups:
                - "ROI Scores"
            avg_tvod_roi_score:
              type: average
              label: "Avg TVOD ROI Score"
              round: 2
              groups:
                - "ROI Scores"
            max_tvod_roi_score:
              type: max
              label: "Peak TVOD ROI Score"
              round: 2
              groups:
                - "ROI Scores"

      - name: avod_score_market_adjusted
        description: "AVOD raw score with a 10 % cross-market bonus per additional market beyond the first: `avod_raw_score × (1 + (market_count - 1) × 0.1)`. Rewards titles that are popular across multiple regions, improving licensing ROI."
        meta:
          dimension:
            type: number
            label: "AVOD Score (Market-Adjusted)"
          metrics:
            avg_avod_score_market_adjusted:
              type: average
              label: "Avg Market-Adjusted AVOD Score"
              round: 2
              groups:
                - "AVOD Demand"
                - "Market Insights"

      - name: cost_tier
        description: "Estimated licensing cost category: `'premium'`, `'mid_tier'`, `'catalog'`, `'low_cost'`. Based on `release_year` and `imdb_votes`. See model description for thresholds."
        meta:
          dimension:
            type: string
            label: "Cost Tier"

      - name: cost_multiplier
        description: "Numeric divisor used in ROI score calculation. Combines cost tier (1.0–4.0) and content type (movies × 1.5). Range: 1.0 (low-cost show) to 6.0 (premium movie)."
        meta:
          dimension:
            type: number
            label: "Cost Multiplier"
          metrics:
            avg_cost_multiplier:
              type: average
              label: "Avg Cost Multiplier"
              round: 2
              groups:
                - "Cost Model"

      - name: market_count
        description: "Count of distinct `app_locale` values with demand for this title, sourced from `int_title_market_demand`. Titles demanded in 3+ markets earn a +25 bonus in `fct_title_acquisition_priority`."
        meta:
          dimension:
            type: number
            label: "Market Count"
          metrics:
            avg_market_count:
              type: average
              label: "Avg Markets per Title"
              round: 1
              groups:
                - "Market Insights"
            max_market_count:
              type: max
              label: "Max Market Reach"
              groups:
                - "Market Insights"

      - name: has_avod_supply
        description: "True if at least one `free` or `ads` clickout was observed for this title in `int_title_provider_supply`. Proxy for 'title is currently available on a free/ad-supported platform'."
        meta:
          dimension:
            type: boolean
            label: "Has AVOD Supply"
          metrics:
            titles_with_avod_supply:
              type: count
              label: "Titles with AVOD Supply"
              filters:
                - has_avod_supply: "true"
              groups:
                - "Supply Coverage"

      - name: has_tvod_supply
        description: "True if at least one `rent`, `buy`, or `cinema` clickout was observed."
        meta:
          dimension:
            type: boolean
            label: "Has TVOD Supply"
          metrics:
            titles_with_tvod_supply:
              type: count
              label: "Titles with TVOD Supply"
              filters:
                - has_tvod_supply: "true"
              groups:
                - "Supply Coverage"

      - name: has_svod_supply
        description: "True if at least one `flatrate` or `sports` clickout was observed. Indicates the title is on a subscription service — relevant for TVOD-to-AVOD candidate identification."
        meta:
          dimension:
            type: boolean
            label: "Has SVOD Supply"
          metrics:
            titles_with_svod_supply:
              type: count
              label: "Titles with SVOD Supply"
              filters:
                - has_svod_supply: "true"
              groups:
                - "Supply Coverage"

      - name: avod_provider_count
        description: "Number of distinct providers offering the title in a free/ads monetisation model."
        meta:
          dimension:
            type: number
            label: "AVOD Provider Count"
          metrics:
            avg_avod_provider_count:
              type: average
              label: "Avg AVOD Providers per Title"
              round: 1
              groups:
                - "Supply Coverage"

      - name: tvod_provider_count
        description: "Number of distinct providers offering the title via rent/buy/cinema."
        meta:
          dimension:
            type: number
            label: "TVOD Provider Count"
          metrics:
            avg_tvod_provider_count:
              type: average
              label: "Avg TVOD Providers per Title"
              round: 1
              groups:
                - "Supply Coverage"

      - name: is_avod_underserved
        description: "True when `avod_raw_score > 0 AND has_avod_supply = false`. The title has observed AVOD demand but no current free/ads supply — a licensing gap opportunity."
        meta:
          dimension:
            type: boolean
            label: "AVOD Gap Opportunity"
          metrics:
            avod_gap_titles:
              type: count
              label: "AVOD Gap Titles"
              description: "Count of titles with AVOD demand but no free/ads supply."
              filters:
                - is_avod_underserved: "true"
              groups:
                - "Gap Opportunities"

      - name: is_tvod_underserved
        description: "True when `tvod_raw_score > 0 AND has_tvod_supply = false`. High transactional intent but no rent/buy supply observed."
        meta:
          dimension:
            type: boolean
            label: "TVOD Gap Opportunity"
          metrics:
            tvod_gap_titles:
              type: count
              label: "TVOD Gap Titles"
              description: "Count of titles with TVOD demand but no rent/buy supply."
              filters:
                - is_tvod_underserved: "true"
              groups:
                - "Gap Opportunities"

      - name: licensing_recommendation
        description: |
          Rule-based recommendation:
          `'avod_priority'` — AVOD ROI ≥ TVOD ROI and AVOD > 0.
          `'tvod_priority'` — TVOD ROI > AVOD ROI and TVOD > 0.
          `'low_priority'` — no significant demand in either direction.
        meta:
          dimension:
            type: string
            label: "Licensing Recommendation"

      - name: demand_rank
        description: "Overall engagement rank across all titles: `ROW_NUMBER() OVER (ORDER BY avod_raw_score + tvod_raw_score DESC)`. Rank 1 = highest absolute demand. Compare with `avod_roi_rank` which adjusts for cost."
        meta:
          dimension:
            type: number
            label: "Demand Rank"

      - name: avod_roi_rank
        description: "Rank by `avod_roi_score` descending. Titles with strong AVOD demand relative to their licensing cost rank high even if their absolute score is lower than a blockbuster."
        meta:
          dimension:
            type: number
            label: "AVOD ROI Rank"

      - name: tvod_roi_rank
        description: "Rank by `tvod_roi_score` descending."
        meta:
          dimension:
            type: number
            label: "TVOD ROI Rank"

      - name: total_user_engagements
        description: |
          Sum of `unique_users` across all days from `int_title_demand_signals`.
          **Note:** this double-counts users active on multiple days. It represents
          user-day engagement count, not true unique users per title. Labelled
          `total_user_engagements` (not `unique_users`) to communicate this clearly.
        meta:
          dimension:
            type: number
            label: "Total User Engagements"
          metrics:
            sum_user_engagements:
              type: sum
              label: "Total User Engagements"
              compact: "thousands"
              groups:
                - "Volume"
            avg_user_engagements:
              type: average
              label: "Avg User Engagements per Title"
              round: 0
              groups:
                - "Volume"

  # ── fct_genre_demand_profile ─────────────────────────────────────────────────
  - name: fct_genre_demand_profile
    description: |
      **Grain: one row per genre**

      AVOD vs TVOD demand profile by content genre. Answers the question:
      *"Which genres should we prioritise for our AVOD catalogue vs TVOD catalogue?"*

      **LATERAL FLATTEN** is used to unnest `base_objects.genre_tmdb` (an ARRAY).
      A title with genres `['Drama', 'Thriller']` appears in **both** the Drama row
      and the Thriller row. Total demand values are therefore not additive across
      genres — a single title contributes its full demand score to each genre it
      belongs to.

      **avod_share** is the primary strategic output: values close to 1.0 indicate
      genres that drive primarily AVOD engagement (high-volume, rewatchable content
      like Comedy and Reality TV), while values close to 0.0 indicate premium
      TVOD-driven genres (e.g. Action blockbusters, Event films).

      **avod_demand_per_title** and **tvod_demand_per_title** normalise total demand
      by title count, revealing the per-title intensity rather than just the volume
      driven by how many titles a genre contains.
    columns:
      - name: genre
        description: "Primary key. Genre label from `base_objects.genre_tmdb` ARRAY, unnested via `LATERAL FLATTEN`. Values come from TMDB genre taxonomy (e.g. `'Drama'`, `'Action'`, `'Comedy'`)."
        meta:
          dimension:
            type: string
            label: "Genre"
          metrics:
            count_of_genre:
              type: count
              label: "Number of Genres"
              groups:
                - "Volume"

      - name: title_count
        description: "Number of distinct top-level titles in this genre with any demand signal."
        meta:
          dimension:
            type: number
            label: "Title Count"
          metrics:
            total_titles_in_genre:
              type: sum
              label: "Total Titles (across genres)"
              description: "Sum of title counts — titles appearing in multiple genres are double-counted."
              groups:
                - "Volume"
            avg_titles_per_genre:
              type: average
              label: "Avg Titles per Genre"
              round: 0
              groups:
                - "Volume"

      - name: total_avod_demand
        description: "Sum of `avod_raw_score` across all titles in this genre. Consistent weighting with `fct_title_licensing_score`."
        meta:
          dimension:
            type: number
            label: "AVOD Demand"
          metrics:
            sum_avod_demand:
              type: sum
              label: "Total AVOD Demand"
              compact: "thousands"
              groups:
                - "AVOD Demand"
            avg_avod_demand_per_genre:
              type: average
              label: "Avg AVOD Demand per Genre"
              round: 0
              groups:
                - "AVOD Demand"

      - name: total_tvod_demand
        description: "Sum of `tvod_raw_score` across all titles in this genre."
        meta:
          dimension:
            type: number
            label: "TVOD Demand"
          metrics:
            sum_tvod_demand:
              type: sum
              label: "Total TVOD Demand"
              compact: "thousands"
              groups:
                - "TVOD Demand"
            avg_tvod_demand_per_genre:
              type: average
              label: "Avg TVOD Demand per Genre"
              round: 0
              groups:
                - "TVOD Demand"

      - name: avod_share
        description: "AVOD demand as a fraction of total demand: `total_avod_demand / (total_avod_demand + total_tvod_demand)`. Range 0–1. High values indicate AVOD-friendly genres; low values indicate premium TVOD genres."
        meta:
          dimension:
            type: number
            label: "AVOD Share (0–1)"
          metrics:
            avg_avod_share:
              type: average
              label: "Avg AVOD Share"
              round: 2
              description: "Average fraction of demand that is AVOD-oriented across genres."
              groups:
                - "AVOD Demand"
            max_avod_share:
              type: max
              label: "Most AVOD-Dominant Genre Share"
              round: 2
              groups:
                - "AVOD Demand"
            min_avod_share:
              type: min
              label: "Most TVOD-Dominant Genre Share"
              round: 2
              groups:
                - "TVOD Demand"

      - name: avg_imdb_score
        description: "Average IMDB score across titles in this genre. Higher-rated genres tend to command higher licensing costs."
        meta:
          dimension:
            type: number
            label: "Avg IMDB Score"
          metrics:
            overall_avg_imdb_score:
              type: average
              label: "Overall Avg IMDB Score"
              round: 2
              groups:
                - "Content Quality"

      - name: avod_demand_per_title
        description: "Average AVOD demand score per title in this genre. Normalises for genre size — a large genre with many average titles vs a small genre with a few blockbusters."
        meta:
          dimension:
            type: number
            label: "AVOD Demand per Title"
          metrics:
            avg_avod_intensity:
              type: average
              label: "Avg AVOD Demand Intensity"
              round: 1
              description: "Average per-title AVOD demand across genres — reveals intensity vs volume."
              groups:
                - "AVOD Demand"
            max_avod_intensity:
              type: max
              label: "Highest AVOD Demand Intensity"
              round: 1
              groups:
                - "AVOD Demand"

      - name: tvod_demand_per_title
        description: "Average TVOD demand score per title in this genre."
        meta:
          dimension:
            type: number
            label: "TVOD Demand per Title"
          metrics:
            avg_tvod_intensity:
              type: average
              label: "Avg TVOD Demand Intensity"
              round: 1
              groups:
                - "TVOD Demand"
            max_tvod_intensity:
              type: max
              label: "Highest TVOD Demand Intensity"
              round: 1
              groups:
                - "TVOD Demand"

  # ── fct_market_demand_gap ─────────────────────────────────────────────────────
  - name: fct_market_demand_gap
    description: |
      **Grain: one row per app_locale (user-chosen market)**

      Market entry scorecard. Answers: *"If JustWatch launches AVOD in one country
      first, which market has the highest demand-to-supply gap?"*

      **Supply is global, not per-market.** The model flags a title as "underserved"
      in a market when it has demand in that market AND no observed free/ads supply
      globally (in `int_title_provider_supply`). This is an approximation — a title
      may be available on a platform in Germany but not in France. More granular
      supply data would require a provider catalogue feed not available in this dataset.

      **avod_opportunity_score** is the market entry ranking signal:
      `total_avod_demand × avod_gap_ratio`. A market with both high demand AND
      a high fraction of un-supplied titles scores highest. A market with high demand
      but most titles already available on free platforms scores lower.

      **Source:** `int_title_market_demand` uses `app_locale`, correctly capturing
      user intent by chosen market rather than physical IP location.
    meta:
      metrics:
        total_markets:
          type: number
          sql: "COUNT(*)"
          label: "Markets Analysed"
          groups:
            - "Market Overview"
    columns:
      - name: app_locale
        description: "Primary key. User's chosen market locale. E.g. `'de_DE'`, `'en_GB'`, `'fr_FR'`. Sourced from `int_title_market_demand.app_locale`."
        meta:
          dimension:
            type: string
            label: "Market (app_locale)"
          metrics:
            market_count:
              type: count_distinct
              label: "Number of Markets"
              groups:
                - "Market Overview"

      - name: total_avod_demand
        description: "Sum of `avod_demand` across all titles in this market."
        meta:
          dimension:
            type: number
            label: "Total AVOD Demand"
          metrics:
            sum_market_avod_demand:
              type: sum
              label: "Total AVOD Demand (all markets)"
              compact: "millions"
              groups:
                - "AVOD Demand"
            avg_market_avod_demand:
              type: average
              label: "Avg AVOD Demand per Market"
              round: 0
              groups:
                - "AVOD Demand"
            max_market_avod_demand:
              type: max
              label: "Highest AVOD Demand Market"
              groups:
                - "AVOD Demand"

      - name: total_tvod_demand
        description: "Sum of `tvod_demand` across all titles in this market."
        meta:
          dimension:
            type: number
            label: "Total TVOD Demand"
          metrics:
            sum_market_tvod_demand:
              type: sum
              label: "Total TVOD Demand (all markets)"
              compact: "millions"
              groups:
                - "TVOD Demand"
            avg_market_tvod_demand:
              type: average
              label: "Avg TVOD Demand per Market"
              round: 0
              groups:
                - "TVOD Demand"

      - name: avod_gap_titles
        description: "Count of distinct titles with AVOD demand but no observed free/ads supply globally. These are the titles JustWatch could fill for this market."
        meta:
          dimension:
            type: number
            label: "AVOD Gap Titles Count"
          metrics:
            sum_avod_gap_titles:
              type: sum
              label: "Total AVOD Gap Titles"
              description: "Total count of titles across all markets that have AVOD demand but no free/ads supply."
              groups:
                - "Gap Analysis"
            avg_avod_gap_titles:
              type: average
              label: "Avg AVOD Gap Titles per Market"
              round: 0
              groups:
                - "Gap Analysis"

      - name: avod_gap_ratio
        description: "`avod_gap_titles / titles_with_avod_demand`. Fraction of demand-bearing titles that lack AVOD supply. Range 0–1. Higher = more of this market's desired content has no free option."
        meta:
          dimension:
            type: number
            label: "AVOD Gap Ratio (0–1)"
          metrics:
            avg_avod_gap_ratio:
              type: average
              label: "Avg AVOD Gap Ratio"
              round: 2
              description: "Average fraction of desired titles with no free/ads supply across markets."
              groups:
                - "Gap Analysis"
            max_avod_gap_ratio:
              type: max
              label: "Highest AVOD Gap Ratio"
              round: 2
              groups:
                - "Gap Analysis"

      - name: avod_opportunity_score
        description: "Primary market entry ranking score: `total_avod_demand × avod_gap_ratio`. Balances raw market size against the proportion of unmet demand. Use to rank markets for JustWatch AVOD launch order."
        meta:
          dimension:
            type: number
            label: "AVOD Opportunity Score"
          metrics:
            sum_opportunity_score:
              type: sum
              label: "Total Opportunity Score"
              groups:
                - "Market Ranking"
            avg_opportunity_score:
              type: average
              label: "Avg Opportunity Score"
              round: 0
              groups:
                - "Market Ranking"
            max_opportunity_score:
              type: max
              label: "Top Market Opportunity Score"
              groups:
                - "Market Ranking"

      - name: avod_supply_coverage
        description: "Inverse of `avod_gap_ratio`: fraction of AVOD-demand titles that already have free/ads supply. Useful for framing the competitive baseline in a market."
        meta:
          dimension:
            type: number
            label: "AVOD Supply Coverage (0–1)"
          metrics:
            avg_supply_coverage:
              type: average
              label: "Avg AVOD Supply Coverage"
              round: 2
              description: "Average fraction of AVOD-desired titles already covered by free/ads supply."
              groups:
                - "Supply Coverage"

      - name: total_unique_users
        description: "Sum of distinct users with any demand signal in this market."
        meta:
          dimension:
            type: number
            label: "Total Unique Users"
          metrics:
            sum_market_users:
              type: sum
              label: "Total Users Across Markets"
              compact: "millions"
              groups:
                - "Market Overview"
            avg_users_per_market:
              type: average
              label: "Avg Users per Market"
              round: 0
              compact: "thousands"
              groups:
                - "Market Overview"

  # ── fct_title_seasonality ─────────────────────────────────────────────────────
  - name: fct_title_seasonality
    description: |
      **Grain: one row per (title_entity_id, week_start)**

      Weekly demand trends across the November 2025 – January 2026 window
      (T3 source table). The only model in the project that requires T3 —
      T1 covers December only and cannot detect pre/post-Christmas trends.

      **is_holiday_window** flags weeks that fall within Dec 20 – Jan 6, the
      Christmas and New Year period. Comparing `weekly_avod_score` inside vs
      outside this window reveals whether a title benefits from the holiday
      viewing spike.

      **avod_score_wow_change** is a LAG window function computed per title:
      `weekly_avod_score - LAG(weekly_avod_score)`. Positive values indicate
      growing demand; negative values indicate fading. Use this to identify
      titles at peak demand (ideal licensing timing) vs titles on the downswing.

      **Recommended warehouse:** `WH_TEAM_<N>_S` or larger. T3 is 128 M rows
      and this model does a full scan plus GROUP BY before joining to objects.
    meta:
      metrics:
        holiday_avod_lift_pct:
          type: number
          sql: |
            (AVG(CASE WHEN ${TABLE}.is_holiday_window THEN ${TABLE}.weekly_avod_score END)
             - AVG(CASE WHEN NOT ${TABLE}.is_holiday_window THEN ${TABLE}.weekly_avod_score END))
            / NULLIF(AVG(CASE WHEN NOT ${TABLE}.is_holiday_window THEN ${TABLE}.weekly_avod_score END), 0) * 100
          label: "Holiday AVOD Lift %"
          description: "Percentage uplift in weekly AVOD score during holiday window vs non-holiday."
          round: 1
          groups:
            - "Seasonality"
    columns:
      - name: title_entity_id
        description: "Part of the composite primary key."
        meta:
          dimension:
            type: string
            label: "Title ID"
          metrics:
            unique_titles_weekly:
              type: count_distinct
              label: "Unique Titles (Weekly)"
              groups:
                - "Volume"

      - name: week_start
        description: "Part of the composite primary key. Monday of the ISO week (`DATE_TRUNC('week', collector_tstamp)`)."
        meta:
          dimension:
            type: date
            label: "Week"
            time_intervals:
              - WEEK
              - MONTH

      - name: title
        description: "Title name from base_objects."
        meta:
          dimension:
            type: string
            label: "Title"

      - name: object_type
        description: "Content type: 'movie' or 'show'."
        meta:
          dimension:
            type: string
            label: "Content Type"

      - name: release_year
        description: "Year of release."
        meta:
          dimension:
            type: number
            label: "Release Year"

      - name: original_language
        description: "Original production language (ISO 639-1 code)."
        meta:
          dimension:
            type: string
            label: "Original Language"

      - name: is_holiday_window
        description: "True for weeks overlapping Dec 20 – Jan 6. Used to compare holiday vs non-holiday demand intensity."
        meta:
          dimension:
            type: boolean
            label: "Holiday Window"
          metrics:
            holiday_weeks:
              type: count
              label: "Holiday Window Observations"
              filters:
                - is_holiday_window: "true"
              groups:
                - "Seasonality"

      - name: weekly_avod_score
        description: "AVOD demand score for this title in this week: `page_views × 1 + watchlist_adds × 5 + avod_clickouts × 10`. Same weights as `fct_title_licensing_score` for cross-model consistency."
        meta:
          dimension:
            type: number
            label: "Weekly AVOD Score"
          metrics:
            total_weekly_avod_score:
              type: sum
              label: "Total Weekly AVOD Score"
              compact: "millions"
              groups:
                - "AVOD Demand"
            avg_weekly_avod_score:
              type: average
              label: "Avg Weekly AVOD Score"
              round: 1
              groups:
                - "AVOD Demand"
            max_weekly_avod_score:
              type: max
              label: "Peak Weekly AVOD Score"
              groups:
                - "AVOD Demand"

      - name: weekly_tvod_score
        description: "TVOD demand score for this title in this week: `rent_clickouts × 10 + buy_clickouts × 8`."
        meta:
          dimension:
            type: number
            label: "Weekly TVOD Score"
          metrics:
            total_weekly_tvod_score:
              type: sum
              label: "Total Weekly TVOD Score"
              compact: "millions"
              groups:
                - "TVOD Demand"
            avg_weekly_tvod_score:
              type: average
              label: "Avg Weekly TVOD Score"
              round: 1
              groups:
                - "TVOD Demand"

      - name: page_views
        description: "Weekly page view count for this title."
        meta:
          dimension:
            type: number
            label: "Page Views"
          metrics:
            total_page_views:
              type: sum
              label: "Total Page Views"
              compact: "millions"
              groups:
                - "Engagement Signals"
            avg_weekly_page_views:
              type: average
              label: "Avg Weekly Page Views"
              round: 0
              groups:
                - "Engagement Signals"

      - name: watchlist_adds
        description: "Weekly watchlist add count for this title."
        meta:
          dimension:
            type: number
            label: "Watchlist Adds"
          metrics:
            total_watchlist_adds:
              type: sum
              label: "Total Watchlist Adds"
              compact: "thousands"
              groups:
                - "Engagement Signals"

      - name: avod_clickouts
        description: "Weekly free/ads clickout count."
        meta:
          dimension:
            type: number
            label: "AVOD Clickouts"
          metrics:
            total_avod_clickouts:
              type: sum
              label: "Total AVOD Clickouts"
              compact: "thousands"
              groups:
                - "AVOD Demand"

      - name: tvod_clickouts
        description: "Weekly rent+buy+cinema clickout count."
        meta:
          dimension:
            type: number
            label: "TVOD Clickouts"
          metrics:
            total_tvod_clickouts:
              type: sum
              label: "Total TVOD Clickouts"
              compact: "thousands"
              groups:
                - "TVOD Demand"

      - name: unique_users
        description: "Distinct user count with any event for this title in this week."
        meta:
          dimension:
            type: number
            label: "Unique Users (Weekly)"
          metrics:
            total_unique_users_weekly:
              type: sum
              label: "Total Weekly User Engagements"
              compact: "millions"
              groups:
                - "Volume"
            avg_weekly_unique_users:
              type: average
              label: "Avg Weekly Unique Users"
              round: 0
              groups:
                - "Volume"

      - name: market_count
        description: "Count of distinct markets with activity for this title in this week."
        meta:
          dimension:
            type: number
            label: "Markets (Weekly)"
          metrics:
            avg_weekly_markets:
              type: average
              label: "Avg Weekly Market Reach"
              round: 1
              groups:
                - "Market Insights"

      - name: avod_score_wow_change
        description: "Week-over-week change: `weekly_avod_score - LAG(weekly_avod_score) OVER (PARTITION BY title_entity_id ORDER BY week_start)`. NULL for the first week a title appears."
        meta:
          dimension:
            type: number
            label: "WoW AVOD Score Change"
          metrics:
            avg_wow_change:
              type: average
              label: "Avg WoW AVOD Change"
              round: 1
              description: "Average week-over-week AVOD score change. Positive = demand growing."
              groups:
                - "Seasonality"
            sum_positive_wow:
              type: sum
              label: "Total Positive WoW Changes"
              filters:
                - avod_score_wow_change: "> 0"
              groups:
                - "Seasonality"

  # ── fct_user_segments ─────────────────────────────────────────────────────────
  - name: fct_user_segments
    description: |
      **Grain: one row per user_id**

      Customer segmentation model. Assigns each user to one of five behavioural
      segments based on their AVOD/TVOD intent scores and churn risk signal.
      This is a **rule-based proxy** for the K-Means clustering in `streamcap_ml.py`.
      Both approaches should produce similar segment distributions — the rule-based
      version runs entirely in SQL for immediate use without Python infrastructure.

      **Segment definitions:**
      - `whale`      — Top-quartile TVOD intent (`tvod_quartile = 1`). These users actively rent/buy.
                       Target with premium newly released content.
      - `binger`     — Top-quartile AVOD intent (`avod_quartile = 1`). These users browse and save
                       large amounts of content. Target with high-volume rewatchable series.
      - `churn_risk` — Previously active (≥3 events in Dec 1–14) but recent daily activity
                       dropped >50 % (Dec 15–31 daily rate < 50 % of Dec 1–14 daily rate).
                       **`churn_risk` overrides `whale`/`binger`** — retention is more valuable
                       than acquisition at the margin.
      - `casual`     — Active users (≥2 events) below top-quartile on both intent dimensions.
      - `dormant`    — Fewer than 2 total events. Excluded from `fct_segment_title_demand`.

      **Intent score normalisation:** raw intent scores are per-active-day rates
      (AVOD signals / `active_days`) then normalised to 0–100 using the observed
      maximum as the ceiling. This prevents power users who visited many days from
      inflating the scale.

      **NTILE(4) partitioned by signal presence:** quartile computation is partitioned
      by whether the user has any signal (`avod_intent_raw > 0`). This ensures users
      with zero AVOD activity are not accidentally classified as quartile-1 AVOD users
      when the overall distribution is skewed toward zero.
    meta:
      metrics:
        churn_risk_rate:
          type: number
          sql: "COUNT(CASE WHEN ${TABLE}.user_segment = 'churn_risk' THEN 1 END)::float / NULLIF(COUNT(*), 0) * 100"
          label: "Churn Risk Rate %"
          description: "Percentage of all users classified as churn risk."
          round: 1
          groups:
            - "Churn Risk"
        whale_rate:
          type: number
          sql: "COUNT(CASE WHEN ${TABLE}.user_segment = 'whale' THEN 1 END)::float / NULLIF(COUNT(*), 0) * 100"
          label: "Whale User Rate %"
          round: 1
          groups:
            - "User Segments"
        binger_rate:
          type: number
          sql: "COUNT(CASE WHEN ${TABLE}.user_segment = 'binger' THEN 1 END)::float / NULLIF(COUNT(*), 0) * 100"
          label: "Binger User Rate %"
          round: 1
          groups:
            - "User Segments"
    columns:
      - name: user_id
        description: "Primary key. Join to `int_user_activity` for raw signal counts, or to `fct_segment_title_demand` via `INNER JOIN` to filter events to non-dormant users."
        meta:
          dimension:
            type: string
            label: "User ID"
          metrics:
            total_users:
              type: count_distinct
              label: "Total Users"
              groups:
                - "User Segments"

      - name: user_segment
        description: |
          One of: `'whale'`, `'binger'`, `'churn_risk'`, `'casual'`, `'dormant'`.
          Priority order in the CASE expression:
          1. `churn_risk` — evaluated first (retention value highest)
          2. `whale` — top-quartile TVOD
          3. `binger` — top-quartile AVOD
          4. `casual` — any engagement, below top quartile
          5. `dormant` — minimal events
        meta:
          dimension:
            type: string
            label: "User Segment"
          metrics:
            whale_users:
              type: count
              label: "Whale Users"
              filters:
                - user_segment: "whale"
              groups:
                - "User Segments"
            binger_users:
              type: count
              label: "Binger Users"
              filters:
                - user_segment: "binger"
              groups:
                - "User Segments"
            churn_risk_users:
              type: count
              label: "Churn Risk Users"
              filters:
                - user_segment: "churn_risk"
              groups:
                - "Churn Risk"
            casual_users:
              type: count
              label: "Casual Users"
              filters:
                - user_segment: "casual"
              groups:
                - "User Segments"
            dormant_users:
              type: count
              label: "Dormant Users"
              filters:
                - user_segment: "dormant"
              groups:
                - "User Segments"

      - name: primary_market
        description: "The `app_locale` value this user used most frequently."
        meta:
          dimension:
            type: string
            label: "Primary Market"

      - name: avod_intent_score
        description: "Normalised AVOD intent score (0–100). Computed as `MIN(avod_intent_raw / max_avod_intent × 100, 100)`. Higher values indicate users who frequently browse free/ad-supported content."
        meta:
          dimension:
            type: number
            label: "AVOD Intent Score"
          metrics:
            avg_avod_intent:
              type: average
              label: "Avg AVOD Intent Score"
              round: 1
              groups:
                - "User Intent"
            median_avod_intent:
              type: median
              label: "Median AVOD Intent Score"
              round: 1
              groups:
                - "User Intent"

      - name: tvod_intent_score
        description: "Normalised TVOD intent score (0–100). Higher values indicate users who regularly rent or buy content."
        meta:
          dimension:
            type: number
            label: "TVOD Intent Score"
          metrics:
            avg_tvod_intent:
              type: average
              label: "Avg TVOD Intent Score"
              round: 1
              groups:
                - "User Intent"
            median_tvod_intent:
              type: median
              label: "Median TVOD Intent Score"
              round: 1
              groups:
                - "User Intent"

      - name: churn_risk_flag
        description: |
          True when both conditions hold:
          1. `recent_period_events / 17 < early_period_events / 14 × 0.5`
             (recent daily rate less than half of early daily rate)
          2. `early_period_events >= 3`
             (user had meaningful early-month engagement — filters out low-signal users)
        meta:
          dimension:
            type: boolean
            label: "Churn Risk Flag"
          metrics:
            users_at_churn_risk:
              type: count
              label: "Users at Churn Risk"
              filters:
                - churn_risk_flag: "true"
              groups:
                - "Churn Risk"

      - name: avod_quartile
        description: "NTILE(4) rank by `avod_intent_raw` within the group of users who have any AVOD signal. Quartile 1 = top 25 % of AVOD-active users. Used to determine `binger` segment."
        meta:
          dimension:
            type: number
            label: "AVOD Quartile"

      - name: tvod_quartile
        description: "NTILE(4) rank by `tvod_intent_raw` within the group of users who have any TVOD signal. Quartile 1 = top 25 % of TVOD-active users. Used to determine `whale` segment."
        meta:
          dimension:
            type: number
            label: "TVOD Quartile"

      - name: active_days
        description: "Distinct calendar dates with at least one event."
        meta:
          dimension:
            type: number
            label: "Active Days"
          metrics:
            avg_active_days:
              type: average
              label: "Avg Active Days per User"
              round: 1
              groups:
                - "User Engagement"
            max_active_days:
              type: max
              label: "Max Active Days"
              groups:
                - "User Engagement"

      - name: total_sessions
        description: "Distinct `session_id` count across all events for this user."
        meta:
          dimension:
            type: number
            label: "Total Sessions"
          metrics:
            avg_sessions_per_user:
              type: average
              label: "Avg Sessions per User"
              round: 1
              groups:
                - "User Engagement"

      - name: unique_titles_engaged
        description: "Distinct `title_entity_id` count for this user. Content breadth signal."
        meta:
          dimension:
            type: number
            label: "Unique Titles Engaged"
          metrics:
            avg_titles_per_user:
              type: average
              label: "Avg Titles per User"
              round: 1
              groups:
                - "User Engagement"
            sum_title_engagements:
              type: sum
              label: "Total Title Engagements"
              compact: "millions"
              groups:
                - "User Engagement"

  # ── fct_segment_title_demand ─────────────────────────────────────────────────
  - name: fct_segment_title_demand
    description: |
      **Grain: one row per (title_entity_id, user_segment)**

      Title demand broken down by customer segment. This is the bridge between
      the customer segmentation layer and the content licensing layer.

      **Why this model exists:** `fct_title_licensing_score` aggregates demand
      across all users. This model reveals *who* is driving that demand. A title
      with high overall AVOD demand driven primarily by Bingers is a better AVOD
      acquisition candidate than a title driven by Whales (who prefer to pay to
      watch, not watch free).

      **INNER JOIN** with `fct_user_segments`: only events from non-dormant users
      are included. Dormant users (`user_segment = 'dormant'`) are excluded from the
      segment demand calculation — they had minimal engagement and would dilute the
      segment signals.

      **Downstream use in `fct_title_acquisition_priority`:**
      - `binger_avod_demand` → AVOD gap opportunity flag and binger-driven bonus
      - `whale_tvod_demand` → Whale segment TVOD demand
      - `churn_risk_demand` → Churn prevention title flag (+15 bonus in composite score)
    meta:
      metrics:
        binger_avod_vs_total:
          type: number
          sql: |
            SUM(CASE WHEN ${TABLE}.user_segment = 'binger' THEN ${TABLE}.avod_demand END)
            / NULLIF(SUM(${TABLE}.avod_demand), 0) * 100
          label: "Binger AVOD Share %"
          description: "Percentage of all AVOD demand driven by Binger segment users."
          round: 1
          groups:
            - "Segment Analysis"
        whale_tvod_vs_total:
          type: number
          sql: |
            SUM(CASE WHEN ${TABLE}.user_segment = 'whale' THEN ${TABLE}.tvod_demand END)
            / NULLIF(SUM(${TABLE}.tvod_demand), 0) * 100
          label: "Whale TVOD Share %"
          description: "Percentage of all TVOD demand driven by Whale segment users."
          round: 1
          groups:
            - "Segment Analysis"
    columns:
      - name: title_entity_id
        description: "Part of the composite primary key. Join to `fct_title_licensing_score.title_entity_id`."
        meta:
          dimension:
            type: string
            label: "Title ID"
          metrics:
            unique_titles_by_segment:
              type: count_distinct
              label: "Unique Titles with Segment Demand"
              groups:
                - "Volume"

      - name: user_segment
        description: "Part of the composite primary key. One of: `'whale'`, `'binger'`, `'churn_risk'`, `'casual'`. `'dormant'` is excluded by the INNER JOIN filter."
        meta:
          dimension:
            type: string
            label: "User Segment"

      - name: title
        description: "Title name from base_objects."
        meta:
          dimension:
            type: string
            label: "Title"

      - name: object_type
        description: "Content type: 'movie' or 'show'."
        meta:
          dimension:
            type: string
            label: "Content Type"

      - name: release_year
        description: "Year of release."
        meta:
          dimension:
            type: number
            label: "Release Year"

      - name: imdb_score
        description: "IMDB rating for this title."
        meta:
          dimension:
            type: number
            label: "IMDB Score"
          metrics:
            avg_imdb_score_segment:
              type: average
              label: "Avg IMDB Score"
              round: 2
              groups:
                - "Content Quality"

      - name: avod_demand
        description: "Weighted AVOD demand from users in this segment: `page_views × 1 + watchlist_adds × 5 + avod_clickouts × 10`."
        meta:
          dimension:
            type: number
            label: "AVOD Demand (segment)"
          metrics:
            total_segment_avod_demand:
              type: sum
              label: "Total AVOD Demand by Segment"
              compact: "thousands"
              groups:
                - "AVOD Demand"
            avg_segment_avod_demand:
              type: average
              label: "Avg AVOD Demand per Title-Segment"
              round: 1
              groups:
                - "AVOD Demand"

      - name: tvod_demand
        description: "Weighted TVOD demand from users in this segment: `rent_clickouts × 10 + buy_clickouts × 8`."
        meta:
          dimension:
            type: number
            label: "TVOD Demand (segment)"
          metrics:
            total_segment_tvod_demand:
              type: sum
              label: "Total TVOD Demand by Segment"
              compact: "thousands"
              groups:
                - "TVOD Demand"
            avg_segment_tvod_demand:
              type: average
              label: "Avg TVOD Demand per Title-Segment"
              round: 1
              groups:
                - "TVOD Demand"

      - name: unique_users
        description: "Distinct `user_id` count from this segment with any event for this title."
        meta:
          dimension:
            type: number
            label: "Unique Segment Users"
          metrics:
            total_segment_users:
              type: sum
              label: "Total Segment User Interactions"
              compact: "thousands"
              groups:
                - "Volume"
            avg_segment_users_per_title:
              type: average
              label: "Avg Users per Title-Segment"
              round: 1
              groups:
                - "Volume"

  # ── fct_title_revenue_estimate ───────────────────────────────────────────────
  - name: fct_title_revenue_estimate
    description: |
      **Grain: one row per top-level title**

      Translates demand signals into estimated dollar revenue potential using
      industry benchmark assumptions from `seeds/revenue_benchmarks.csv`.

      **AVOD revenue logic:**
      `avod_clickouts × clickout_to_view_conversion × estimated_view_hours × ecpm_usd / 1000`

      **TVOD revenue logic:**
      `rent_clickouts × margin_per_rent_usd + buy_clickouts × margin_per_buy_usd`

      **ROI:** `(avod_revenue_usd + tvod_revenue_usd) / cost_multiplier`

      Use `acquisition_tier` to quickly filter to the top 10% or 25% of titles
      by ROI. Use `monetization_signal` for a plain-English licensing recommendation.
    meta:
      metrics:
        total_estimated_revenue:
          type: number
          sql: "SUM(${TABLE}.total_revenue_usd)"
          label: "Total Estimated Revenue"
          format: "usd"
          compact: "thousands"
          round: 0
          groups:
            - "Revenue Estimates"
        avg_roi_per_title:
          type: number
          sql: "AVG(${TABLE}.roi_usd)"
          label: "Avg ROI per Title"
          format: "usd"
          round: 2
          groups:
            - "Revenue Estimates"
        avod_revenue_share_pct:
          type: number
          sql: "SUM(${TABLE}.avod_revenue_usd) / NULLIF(SUM(${TABLE}.total_revenue_usd), 0) * 100"
          label: "AVOD Revenue Share %"
          round: 1
          groups:
            - "Revenue Estimates"
    columns:
      - name: title_entity_id
        description: "Primary key. JustWatch top-level title ID."
        meta:
          dimension:
            type: string
            label: "Title ID"
          metrics:
            title_count:
              type: count_distinct
              label: "Titles with Revenue Estimate"
              groups:
                - "Volume"

      - name: title
        description: "Title name."
        meta:
          dimension:
            type: string
            label: "Title"

      - name: object_type
        description: "Content type: 'movie' or 'show'."
        meta:
          dimension:
            type: string
            label: "Content Type"

      - name: release_year
        description: "Year of original release."
        meta:
          dimension:
            type: number
            label: "Release Year"

      - name: original_language
